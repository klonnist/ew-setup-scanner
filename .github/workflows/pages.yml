name: Test ve GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Birim testleri
        run: node --test tests/*.test.js

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Siteyi hazırla
        run: |
          mkdir _site
          cp -r index.html backtest.html src _site/
          # Önbellek kırıcı: ?v=dev → ?v=<commit> (Pages dosyaları 10 dk önbelleğe alır)
          sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" _site/index.html _site/backtest.html
          # Alt modül importları da sürümlenir; yoksa yayından sonraki 10 dk eski/yeni dosyalar karışabilir
          find _site/src -name '*.js' -exec sed -i -E "s#(from '\.{1,2}/[^']+\.js)'#\1?v=${GITHUB_SHA::7}'#g" {} +
          if grep -rhE "from '\.{1,2}/[^']+\.js'" _site/src; then echo "Sürümlenmemiş import kaldı" && exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
